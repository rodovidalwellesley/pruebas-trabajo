<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acuerdo de evaluación laboral</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background-color: #f4f5f7; padding: 20px; color: #222; }
  .container { max-width: 640px; margin: 0 auto; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.10); }

  /* HEADER FLORINDA */
  .header-florinda {
    background: linear-gradient(135deg, #F9B8C4 0%, #F2C12E 100%);
    padding: 20px 24px;
    display: flex; align-items: center; gap: 16px;
  }
  .header-florinda img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; }
  .header-florinda h1 { font-size: 18px; color: #1a1a1a; font-weight: bold; }
  .header-florinda p { font-size: 13px; color: #333; margin-top: 3px; }

  /* HEADER IPA */
  .header-ipa {
    background: linear-gradient(135deg, #1A2A4A 0%, #9B1FBF 60%, #E8541A 100%);
    padding: 20px 24px;
    display: flex; align-items: center; gap: 16px;
  }
  .header-ipa img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; }
  .header-ipa h1 { font-size: 18px; color: #fff; font-weight: bold; }
  .header-ipa p { font-size: 13px; color: #e0d0ff; margin-top: 3px; }

  /* HEADER GENERICO */
  .header-generic {
    background: #1F4E79;
    padding: 20px 24px;
  }
  .header-generic h1 { font-size: 18px; color: #fff; font-weight: bold; }
  .header-generic p { font-size: 13px; color: rgba(255,255,255,0.85); margin-top: 3px; }

  .body { padding: 24px; }
  label { display: block; font-size: 13px; color: #555; margin: 14px 0 4px; }
  input, select, textarea { width: 100%; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; font-family: Arial, sans-serif; }
  textarea { resize: vertical; }

  .btn { margin-top: 20px; width: 100%; padding: 12px; font-size: 15px; font-weight: bold; color: #fff; border: none; border-radius: 6px; cursor: pointer; transition: opacity 0.2s; }
  .btn:hover { opacity: 0.88; }
  .btn:disabled { background: #999 !important; cursor: not-allowed; }
  .btn-florinda { background: linear-gradient(90deg, #e8a020, #e05080); }
  .btn-ipa { background: linear-gradient(90deg, #9B1FBF, #E8541A); }
  .btn-generic { background: #1F4E79; }
  .btn-green { background: #2E7D32; width: auto; padding: 8px 14px; font-size: 13px; margin-top: 8px; }

  .result-box { margin-top: 20px; padding: 14px; background: #EAF6EE; border-radius: 6px; border-left: 4px solid #2E7D32; display: none; }
  .result-box.show { display: block; }
  .result-box strong { font-size: 13px; color: #2E7D32; }
  .result-box textarea { margin-top: 8px; font-size: 12px; min-height: 70px; }

  .field-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .field-row > div { flex: 1; min-width: 130px; }

  h2 { font-size: 15px; border-bottom: 2px solid #ddd; padding-bottom: 5px; margin-top: 26px; color: #1F4E79; }
  h2.florinda { color: #c0306a; border-color: #F2C12E; }
  h2.ipa { color: #7a10a0; border-color: #E8541A; }

  p { font-size: 14px; line-height: 1.6; margin-top: 8px; }
  ul { font-size: 14px; line-height: 1.8; padding-left: 20px; margin-top: 8px; }
  .note { background: #FFF4CE; border: 1px solid #e6d27a; border-radius: 6px; padding: 10px 14px; font-size: 13px; margin: 12px 0; }
  .hint { font-size: 12px; color: #777; margin: 2px 0 4px; }

  .confirm-box { margin-top: 24px; padding: 16px; background: #f0f4f8; border-radius: 8px; border: 1px solid #d5dde5; }
  .confirm-box h2 { margin-top: 0; border: none; padding: 0; }
  .checkbox-row { display: flex; align-items: flex-start; gap: 8px; margin-top: 12px; }
  .checkbox-row input { width: auto; margin-top: 3px; }
  .checkbox-row label { margin: 0; font-size: 13px; color: #333; }

  .error-text { color: #b00020; font-size: 13px; margin-top: 10px; display: none; }
  .error-text.show { display: block; }

  .success-screen { text-align: center; padding: 48px 24px; }
  .success-icon { font-size: 52px; margin-bottom: 12px; }
  .sign-line { margin-top: 28px; border-top: 1px solid #ddd; padding-top: 8px; font-size: 11px; color: #999; }
</style>
</head>

const EMPRESAS = {
  "Florinda": { logo: LOGO_FLORINDA, headerClass: "header-florinda", btnClass: "btn-florinda", h2Class: "florinda" },
  "IPA":      { logo: LOGO_IPA,     headerClass: "header-ipa",      btnClass: "btn-ipa",      h2Class: "ipa" }
};

const PUESTOS = Object.keys(ACTIVIDADES);

function getParams() { return new URLSearchParams(window.location.search); }
function buildLink(data) {
  return window.location.origin + window.location.pathname + "?" + new URLSearchParams(data).toString();
}
function formatFecha(f) {
  if (!f) return "";
  const [y,m,d] = f.split("-");
  return d+"/"+m+"/"+y;
}
function getEmpresaConfig(nombre) {
  return EMPRESAS[nombre] || { logo: null, headerClass: "header-generic", btnClass: "btn-generic", h2Class: "" };
}

function renderHeader(empresa, titulo, subtitulo) {
  const cfg = getEmpresaConfig(empresa);
  const logoHtml = cfg.logo ? `<img src="${cfg.logo}" alt="${empresa}">` : "";
  return `<div class="${cfg.headerClass}">${logoHtml}<div><h1>${titulo}</h1><p>${subtitulo}</p></div></div>`;
}

// ─── GENERADOR ───────────────────────────────
function renderGenerator() {
  const opcionesPuestos = PUESTOS.map(p => `<option value="${p}">${p}</option>`).join("");
  const primerasActividades = ACTIVIDADES[PUESTOS[0]].join("
");
  const opcionesEmpresas = Object.keys(EMPRESAS).map(e => `<option value="${e}">${e}</option>`).join("");

  document.getElementById("app").innerHTML = `
    ${renderHeader("Florinda", "Generador de acuerdo de evaluación laboral", "Completá los datos del candidato y la prueba")}
    <div class="body">
      <label>Empresa</label>
      <select id="g_empresa">${opcionesEmpresas}</select>

      <label>Nombre completo del candidato</label>
      <input type="text" id="g_nombre" placeholder="Juan Pérez">

      <label>DNI</label>
      <input type="text" id="g_dni" placeholder="30123456">

      <label>Puesto</label>
      <select id="g_puesto">${opcionesPuestos}</select>

      <label>Actividades a realizar</label>
      <p class="hint">Se cargan automáticamente según el puesto. Podés editarlas. Una por línea.</p>
      <textarea id="g_actividades" rows="7">${primerasActividades}</textarea>

      <div class="field-row">
        <div><label>Fecha de la prueba</label><input type="date" id="g_fecha"></div>
        <div><label>Horario de inicio</label><input type="time" id="g_horaInicio"></div>
        <div><label>Horario de fin</label><input type="time" id="g_horaFin"></div>
      </div>

      <label>Local / Establecimiento</label>
      <input type="text" id="g_local" placeholder="Sucursal Palermo">

      <div class="field-row">
        <div>
          <label>Modalidad de pago</label>
          <select id="g_modalidad">
            <option value="Por jornada de evaluación">Por jornada de evaluación</option>
            <option value="Diaria">Diaria</option>
            <option value="Otra">Otra</option>
          </select>
        </div>
        <div><label>Monto ($)</label><input type="text" id="g_monto" placeholder="10000"></div>
      </div>

      <button class="btn btn-florinda" id="g_generar">Generar link para el candidato</button>

      <div class="result-box" id="g_resultado">
        <strong>✅ Link generado — copialo y mandalo por WhatsApp:</strong>
        <textarea id="g_linkOutput" readonly></textarea>
        <button class="btn btn-green" id="g_copiar">Copiar link</button>
      </div>
    </div>
  `;

  // Cambiar header y botón al cambiar empresa
  document.getElementById("g_empresa").addEventListener("change", function() {
    const cfg = getEmpresaConfig(this.value);
    const logoHtml = cfg.logo ? `<img src="${cfg.logo}" alt="${this.value}">` : "";
    document.querySelector(".container > div:first-child").outerHTML =
      `<div class="${cfg.headerClass}">${logoHtml}<div><h1>Generador de acuerdo de evaluación laboral</h1><p>Completá los datos del candidato y la prueba</p></div></div>`;
    document.getElementById("g_generar").className = `btn ${cfg.btnClass}`;
  });

  document.getElementById("g_puesto").addEventListener("change", function() {
    const acts = ACTIVIDADES[this.value];
    if (acts) document.getElementById("g_actividades").value = acts.join("
");
  });

  document.getElementById("g_generar").addEventListener("click", () => {
    const nombre    = document.getElementById("g_nombre").value.trim();
    const dni       = document.getElementById("g_dni").value.trim();
    const puesto    = document.getElementById("g_puesto").value;
    const actividades = document.getElementById("g_actividades").value.trim();
    const fecha     = document.getElementById("g_fecha").value;
    const horaInicio= document.getElementById("g_horaInicio").value;
    const horaFin   = document.getElementById("g_horaFin").value;
    const local     = document.getElementById("g_local").value.trim();
    const empresa   = document.getElementById("g_empresa").value;
    const modalidad = document.getElementById("g_modalidad").value;
    const monto     = document.getElementById("g_monto").value.trim();
    if (!nombre||!dni||!fecha||!horaInicio||!local||!monto||!actividades) {
      alert("Completá todos los campos antes de generar el link."); return;
    }
    const link = buildLink({nombre,dni,puesto,actividades,fecha,horaInicio,horaFin,local,empresa,modalidad,monto});
    document.getElementById("g_linkOutput").value = link;
    document.getElementById("g_resultado").classList.add("show");
  });

  document.getElementById("g_copiar").addEventListener("click", () => {
    const ta = document.getElementById("g_linkOutput");
    ta.select(); document.execCommand("copy");
    const btn = document.getElementById("g_copiar");
    btn.textContent = "¡Copiado!";
    setTimeout(() => { btn.textContent = "Copiar link"; }, 1500);
  });
}

// ─── ACUERDO (vista candidato) ────────────────
function renderAcuerdo(params) {
  const nombre     = params.get("nombre") || "";
  const dni        = params.get("dni") || "";
  const puesto     = params.get("puesto") || "";
  const actRaw     = params.get("actividades") || "";
  const fecha      = formatFecha(params.get("fecha") || "");
  const horaInicio = params.get("horaInicio") || "";
  const horaFin    = params.get("horaFin") || "";
  const local      = params.get("local") || "";
  const empresa    = params.get("empresa") || "";
  const modalidad  = params.get("modalidad") || "";
  const monto      = params.get("monto") || "";
  const cfg        = getEmpresaConfig(empresa);

  const actHTML = actRaw.split("
").map(l=>l.trim()).filter(l=>l).map(l=>`<li>${l}</li>`).join("");

  document.getElementById("app").innerHTML = `
    ${renderHeader(empresa, "Acuerdo de participación y consentimiento", "Jornada de evaluación de candidato/a a un puesto de trabajo")}
    <div class="body">
      <p>Entre <strong>${empresa}</strong> (en adelante, &ldquo;la Empresa&rdquo;) y <strong>${nombre}</strong>, DNI N.° <strong>${dni}</strong> (en adelante, &ldquo;el/la Postulante&rdquo;), se acuerda lo siguiente:</p>

      <h2 class="${cfg.h2Class}">1. Objeto</h2>
      <p>El/la Postulante participará de una instancia de evaluación práctica con el único fin de valorar sus aptitudes para el puesto de <strong>${puesto}</strong>. Esta instancia no implica oferta de empleo, contratación ni generación de vínculo laboral. No se trata de un período de prueba en los términos del art. 92 bis de la LCT.</p>

      <h2 class="${cfg.h2Class}">2. Fecha, duración y compensación</h2>
      <p>
        Fecha: <strong>${fecha}</strong><br>
        Horario: <strong>${horaInicio}${horaFin ? " a " + horaFin : ""}</strong><br>
        Local: <strong>${local}</strong><br>
        Modalidad de pago: <strong>${modalidad}</strong><br>
        Monto: <strong>$${monto}</strong>
      </p>

      <h2 class="${cfg.h2Class}">3. Actividades a realizar</h2>
      <ul>${actHTML}</ul>

      <h2 class="${cfg.h2Class}">4. Normas de conducta y seguridad</h2>
      <p>El/la Postulante se compromete a respetar las instrucciones impartidas, mantener una conducta respetuosa con clientes, empleados y proveedores, utilizar correctamente los elementos de trabajo, y cumplir las normas internas de higiene y seguridad.</p>

      <h2 class="${cfg.h2Class}">5. Declaración del/de la Postulante</h2>
      <p>El/la Postulante declara encontrarse en condiciones psicofísicas adecuadas para participar, informar cualquier limitación de salud relevante, y aceptar voluntariamente la evaluación, pudiendo retirarse en cualquier momento sin consecuencias para su postulación.</p>

      <h2 class="${cfg.h2Class}">6. Protección de datos</h2>
      <p>Los datos personales suministrados serán utilizados exclusivamente para el proceso de selección, conforme a la Ley N.° 25.326.</p>

      <div class="confirm-box">
        <h2>Confirmación de aceptación</h2>
        <p>Para confirmar tu participación, ingresá tu nombre completo y DNI tal como figuran arriba.</p>
        <label>Nombre completo</label>
        <input type="text" id="c_nombre" placeholder="Escribí tu nombre completo">
        <label>DNI</label>
        <input type="text" id="c_dni" placeholder="Escribí tu DNI">
        <div class="checkbox-row">
          <input type="checkbox" id="c_acepto">
          <label for="c_acepto">Leí y entendí las condiciones de esta evaluación, y acepto participar voluntariamente.</label>
        </div>
        <button class="btn ${cfg.btnClass}" id="c_confirmar">Confirmar participación</button>
        <div class="error-text" id="c_error">Revisá que el nombre y DNI coincidan con los datos de arriba, y que hayas marcado la casilla.</div>
      </div>
      <div class="sign-line">Documento generado digitalmente · Confirmación registrada con fecha y hora.</div>
    </div>
  `;

  document.getElementById("c_confirmar").addEventListener("click", () => {
    const cNombre = document.getElementById("c_nombre").value.trim();
    const cDni    = document.getElementById("c_dni").value.trim();
    const acepto  = document.getElementById("c_acepto").checked;
    const errorEl = document.getElementById("c_error");

    const nombreOk = cNombre.toLowerCase() === nombre.toLowerCase();
    const dniOk    = cDni.replace(/\D/g,"") === dni.replace(/\D/g,"");

    if (!nombreOk || !dniOk || !acepto) { errorEl.classList.add("show"); return; }
    errorEl.classList.remove("show");

    const btn = document.getElementById("c_confirmar");
    btn.disabled = true;
    btn.textContent = "Enviando confirmación...";

    const ahora = new Date().toLocaleString("es-AR");
    const templateParams = {
      candidato_nombre: nombre,
      candidato_dni:    dni,
      puesto:           puesto,
      fecha:            fecha,
      horario:          horaInicio + (horaFin ? " a " + horaFin : ""),
      local:            local,
      empresa:          empresa,
      compensacion:     modalidad + " — $" + monto,
      fecha_confirmacion: ahora
    };

    // Registrar en Google Sheets
    fetch(SHEETS_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(templateParams)
    }).catch(err => console.warn("Sheets:", err));

    // Enviar mail via EmailJS
    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
      .then(() => { renderSuccess(empresa); })
      .catch(err => {
        btn.disabled = false;
        btn.textContent = "Confirmar participación";
        alert("Hubo un problema al enviar. Probá nuevamente o avisale a la empresa por WhatsApp.");
        console.error(err);
      });
  });
}

// ─── PANTALLA DE ÉXITO ────────────────────────
function renderSuccess(empresa) {
  const cfg = getEmpresaConfig(empresa || "");
  document.getElementById("app").innerHTML = `
    ${renderHeader(empresa, "Confirmación enviada", "")}
    <div class="success-screen">
      <div class="success-icon">✅</div>
      <p style="font-size:16px; font-weight:bold; color:#2E7D32;">Tu participación quedó confirmada.</p>
      <p style="color:#666; margin-top:8px;">Podés cerrar esta página. Te vamos a contactar por WhatsApp.</p>
    </div>
  `;
}

// ─── INIT ─────────────────────────────────────
function init() {
  const params = getParams();
  if (params.has("nombre") && params.has("dni")) { renderAcuerdo(params); }
  else { renderGenerator(); }
}
init();
</script>
</body>
</html>
